name: users-api

on:
  push:
    branches: [main]
    paths:
      - "UsersAPI/**"
      - ".github/workflows/users-api.yml"
      - ".github/workflows/_service-pipeline.yml"
  pull_request:
    branches: [main]
    paths:
      - "UsersAPI/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    uses: ./.github/workflows/_service-pipeline.yml
    # Repassa AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY para o workflow reutilizável
    secrets: inherit
    with:
      service: users-api
      path: UsersAPI
      solution: UsersAPI.sln