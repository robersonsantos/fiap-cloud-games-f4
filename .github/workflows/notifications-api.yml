name: notifications-api

on:
  push:
    branches: [main]
    paths:
      - "NotificationsAPI/**"
      - ".github/workflows/notifications-api.yml"
      - ".github/workflows/_service-pipeline.yml"
  pull_request:
    branches: [main]
    paths:
      - "NotificationsAPI/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    uses: ./.github/workflows/_service-pipeline.yml
    # Repassa AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY para o workflow reutilizável
    secrets: inherit
    with:
      service: notifications-api
      path: NotificationsAPI
      solution: NotificationsAPI.slnx