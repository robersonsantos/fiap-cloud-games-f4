# Ambiente LOCAL da FIAP Cloud Games — Fase 4 (produção roda no Amazon EKS).
#
#   cp .env.example .env      # defina as senhas (o .env não é versionado)
#   docker compose up --build -d
#
# Nenhuma credencial fica neste arquivo: todas vêm do .env via ${VAR:?}.
# Entrada única: http://localhost:8000 (Kong)
# Projeto "fcg-f4": não conflita com os containers das fases anteriores.

name: fcg-f4

x-rabbit-credentials: &rabbit-credentials
  RabbitMQ__Host: rabbitmq
  RabbitMQ__Username: ${RABBITMQ_USER:?defina no .env}
  RabbitMQ__Password: ${RABBITMQ_PASSWORD:?defina no .env}

services:

  # ─── Infraestrutura ──────────────────────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?defina no .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?defina no .env}
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI: http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?defina no .env}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -No || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # MongoDB — NoSQL (avaliações de jogos)
  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?defina no .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?defina no .env}
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Redis — cache distribuído (IDistributedCache)
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?defina no .env}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina no .env}

  # OpenSearch — busca avançada (em produção: Amazon OpenSearch Service gerenciado)
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.1
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"   # UI: http://localhost:5601
    depends_on:
      opensearch:
        condition: service_healthy

  # ─── API Gateway (Kong DB-less) ──────────────────────────────────────────────
  # kong-config renderiza o template kong/kong.yml com a JWT_KEY do .env (mesmo
  # mecanismo do initContainer usado no EKS).

  kong-config:
    image: busybox:1.36
    environment:
      JWT_KEY: ${JWT_KEY:?defina no .env}
    command:
      - sh
      - -c
      - >
        awk '{ k = ENVIRON["JWT_KEY"]; p = "__JWT_KEY__";
               while ((i = index($$0, p)) > 0) { $$0 = substr($$0, 1, i - 1) k substr($$0, i + length(p)) }
               print }' /kong/template/kong.yml > /kong/declarative/kong.yml
    volumes:
      - ./kong/kong.yml:/kong/template/kong.yml:ro
      - kong-declarative:/kong/declarative

  kong:
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"   # proxy (entrada dos clientes)
      - "8001:8001"   # admin API (somente local)
    volumes:
      - kong-declarative:/kong/declarative:ro
    depends_on:
      kong-config:
        condition: service_completed_successfully
      users-api:
        condition: service_started
      catalog-api:
        condition: service_started

  # ─── Observabilidade (Prometheus + Grafana) ──────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - users-api
      - catalog-api

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"   # UI: http://localhost:3000 (admin / GRAFANA_PASSWORD)
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?defina no .env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # ─── Microsserviços ──────────────────────────────────────────────────────────

  users-api:
    build:
      context: ../UsersAPI
    ports:
      - "5001:8080"
    environment:
      <<: *rabbit-credentials
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=FCG_Users;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True
      Jwt__Chave: ${JWT_KEY}
      Jwt__Emissor: FCG-UsersAPI
      Jwt__Audiencia: FCG-Microsservicos
      Jwt__ExpiracaoHoras: "8"
      Admin__Email: ${ADMIN_EMAIL:?defina no .env}
      Admin__Senha: ${ADMIN_PASSWORD:?defina no .env}
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  catalog-api:
    build:
      context: ../CatalogAPI
    ports:
      - "5002:8080"
    environment:
      <<: *rabbit-credentials
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=FCG_Catalog;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True
      Jwt__Chave: ${JWT_KEY}
      Jwt__Emissor: FCG-UsersAPI
      Jwt__Audiencia: FCG-Microsservicos
      MongoDb__ConnectionString: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/?authSource=admin
      MongoDb__Database: FCG_Catalog
      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD},abortConnect=false
      OpenSearch__Url: http://opensearch:9200
      OpenSearch__IndexName: fcg-jogos
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  payments-api:
    build:
      context: ../PaymentsAPI
    environment:
      <<: *rabbit-credentials
      Payment__TaxaAprovacaoPercent: "80"
    depends_on:
      rabbitmq:
        condition: service_healthy

  notifications-api:
    build:
      context: ../NotificationsAPI
    environment:
      <<: *rabbit-credentials
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  kong-declarative:

networks:
  default:
    name: fcg-network