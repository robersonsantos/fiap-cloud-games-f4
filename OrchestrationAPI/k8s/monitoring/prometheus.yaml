# Prometheus — coleta de métricas dos microsserviços (Opção A da Fase 3)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: fcg
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:
      - job_name: users-api
        metrics_path: /metrics
        static_configs:
          - targets: ["users-api:8080"]

      - job_name: catalog-api
        metrics_path: /metrics
        static_configs:
          - targets: ["catalog-api:8080"]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "300m"
      volumes:
      - name: config
        configMap:
          name: prometheus-config

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: fcg
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
  type: ClusterIP
