# Grafana — dashboards de observabilidade (Opção A da Fase 3)
# Acesso: kubectl port-forward -n fcg svc/grafana 3000:3000 → http://localhost:3000
# Usuário admin; senha no Secret fcg-secrets (chave GRAFANA_PASSWORD), criado pela pipeline.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: fcg
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: fcg
data:
  provider.yml: |
    apiVersion: 1
    providers:
      - name: FCG
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: fcg
data:
  fcg-dashboard.json: |
    {
      "uid": "fcg-fase3",
      "title": "FCG — Microsserviços (Fase 4)",
      "tags": ["fcg", "fase3"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5s",
      "time": { "from": "now-15m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Total de requisições (janela atual)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 8, "x": 0, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (job) (increase(http_requests_received_total[$__range]))",
              "legendFormat": "{{job}}"
            }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0 }, "overrides": [] }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Requisições em andamento",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 8, "x": 8, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (job) (http_requests_in_progress)",
              "legendFormat": "{{job}}"
            }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0 }, "overrides": [] }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Taxa de erros 5xx (%)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 8, "x": 16, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (sum by (job) (rate(http_requests_received_total{code=~\"5..\"}[5m])) or sum by (job) (rate(http_requests_received_total[5m])) * 0) / sum by (job) (rate(http_requests_received_total[5m]))",
              "legendFormat": "{{job}}"
            }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value" },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Requisições/s por serviço e status code",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 5 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (job, code) (rate(http_requests_received_total[1m]))",
              "legendFormat": "{{job}} — HTTP {{code}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Latência p95 por serviço",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 5 },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (job, le) (rate(http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{job}} p95"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Latência média por serviço",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 14 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (job) (rate(http_request_duration_seconds_sum[5m])) / sum by (job) (rate(http_request_duration_seconds_count[5m]))",
              "legendFormat": "{{job}} média"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Erros 5xx por segundo",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 14 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (job) (rate(http_requests_received_total{code=~\"5..\"}[1m]))",
              "legendFormat": "{{job}} 5xx/s"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] }
        }
      ]
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:11.6.3
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: "admin"
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fcg-secrets
              key: GRAFANA_PASSWORD
        - name: GF_SECURITY_ALLOW_EMBEDDING
          value: "true"
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "true"
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: "Viewer"
        volumeMounts:
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: dashboard-provider
          mountPath: /etc/grafana/provisioning/dashboards
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "640Mi"
            cpu: "300m"
      volumes:
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: dashboard-provider
        configMap:
          name: grafana-dashboard-provider
      - name: dashboards
        configMap:
          name: grafana-dashboards

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: fcg
spec:
  selector:
    app: grafana
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP
