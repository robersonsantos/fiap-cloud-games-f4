# Redis — cache distribuído (IDistributedCache), protegido por senha (Fase 4)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fcg-secrets
              key: REDIS_PASSWORD
        args: ["--requirepass", "$(REDIS_PASSWORD)", "--maxmemory", "100mb", "--maxmemory-policy", "allkeys-lru"]
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "160Mi"
            cpu: "200m"
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 10