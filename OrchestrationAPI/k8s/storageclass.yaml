# Volumes persistentes em EBS gp3 (driver aws-ebs-csi-driver instalado como add-on do EKS pelo Terraform).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fcg-gp3
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
parameters:
  type: gp3
  encrypted: "true"