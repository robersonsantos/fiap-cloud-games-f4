# Kong API Gateway (DB-less) — ponto de entrada único do sistema FCG
#
# O kong.yml é versionado como TEMPLATE (ConfigMap "kong-config-template", gerado pela
# pipeline a partir de OrchestrationAPI/kong/kong.yml). O initContainer substitui o
# marcador __JWT_KEY__ pelo valor do Secret fcg-secrets e grava o arquivo final num
# volume em memória — a chave nunca aparece em arquivo versionado.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: fcg
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      initContainers:
      - name: render-config
        image: busybox:1.36
        env:
        - name: JWT_KEY
          valueFrom:
            secretKeyRef:
              name: fcg-secrets
              key: JWT_KEY
        command:
        - sh
        - -c
        - |
          awk '{ k = ENVIRON["JWT_KEY"]; p = "__JWT_KEY__";
                 while ((i = index($0, p)) > 0) { $0 = substr($0, 1, i - 1) k substr($0, i + length(p)) }
                 print }' /kong/template/kong.yml > /kong/declarative/kong.yml
        volumeMounts:
        - name: kong-template
          mountPath: /kong/template
          readOnly: true
        - name: kong-config
          mountPath: /kong/declarative
      containers:
      - name: kong
        image: kong:3.9
        ports:
        - containerPort: 8000
          name: proxy
        - containerPort: 8100
          name: status
        env:
        - name: KONG_DATABASE
          value: "off"
        - name: KONG_DECLARATIVE_CONFIG
          value: "/kong/declarative/kong.yml"
        - name: KONG_PROXY_ACCESS_LOG
          value: "/dev/stdout"
        - name: KONG_PROXY_ERROR_LOG
          value: "/dev/stderr"
        # Admin API desabilitada no cluster; status API apenas para os probes.
        - name: KONG_ADMIN_LISTEN
          value: "off"
        - name: KONG_STATUS_LISTEN
          value: "0.0.0.0:8100"
        # 1 worker é suficiente para a demo e evita OOM kill com o limite de memória
        - name: KONG_NGINX_WORKER_PROCESSES
          value: "1"
        volumeMounts:
        - name: kong-config
          mountPath: /kong/declarative
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /status/ready
            port: 8100
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /status
            port: 8100
          initialDelaySeconds: 15
          periodSeconds: 10
      volumes:
      - name: kong-template
        configMap:
          name: kong-config-template
      - name: kong-config
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi