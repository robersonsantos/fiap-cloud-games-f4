# NotificationsAPI — worker que consome UserCreatedEvent e PaymentProcessedEvent (logs de e-mail).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-api
  namespace: fcg
  labels:
    app: notifications-api
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: notifications-api
  template:
    metadata:
      labels:
        app: notifications-api
    spec:
      containers:
      - name: notifications-api
        image: ${IMAGE}
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: fcg-shared-config
        env:
        - name: RabbitMQ__Username
          valueFrom:
            secretKeyRef:
              name: fcg-secrets
              key: RABBITMQ_USER
        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: fcg-secrets
              key: RABBITMQ_PASSWORD
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "300m"